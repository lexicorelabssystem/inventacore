name: DB Backup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      out_name:
        description: "Prefijo opcional para el respaldo"
        required: false
        default: ""

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_NAME: ${{ github.event.inputs.out_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          which pg_dump
          pg_dump --version

      - name: Validate backup source
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_DATABASE_URL:-}" ]; then
            echo "Falta el secret BACKUP_DATABASE_URL."
            exit 1
          fi

      - name: Prepare backup filename
        id: naming
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%d_%H-%M-%S)"
          label="$(printf '%s' "${BACKUP_NAME:-}" | tr -cd 'A-Za-z0-9._-')"
          if [ -n "$label" ]; then
            base="${label}_${stamp}"
          else
            base="inventario_backup_${stamp}"
          fi
          out_file="backups/${base}.dump"
          echo "out_file=$out_file" >> "$GITHUB_OUTPUT"
          echo "artifact_name=inventario-db-backup-${base}" >> "$GITHUB_OUTPUT"

      - name: Create backup
        shell: bash
        env:
          OUT_FILE: ${{ steps.naming.outputs.out_file }}
        run: |
          set -euo pipefail
          node scripts/dbBackup.js --out "$OUT_FILE"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.naming.outputs.artifact_name }}
          path: ${{ steps.naming.outputs.out_file }}
          if-no-files-found: error
          retention-days: 30
